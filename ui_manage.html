<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Display Manager</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f172a;
  --surface:  #1e293b;
  --surface2: #273548;
  --border:   #334155;
  --text:     #f1f5f9;
  --muted:    #94a3b8;
  --primary:  #3b82f6;
  --success:  #22c55e;
  --warning:  #f59e0b;
  --danger:   #ef4444;
  --orange:   #f97316;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-title {
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--primary);
}
#feed-status {
  display: flex;
  gap: 8px;
  flex: 1;
  flex-wrap: wrap;
}
.feed-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  transition: border-color 0.15s, opacity 0.15s;
}
.feed-pill:hover         { border-color: var(--primary); }
.feed-pill.disabled      { opacity: 0.45; }
.feed-pill .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
}
.feed-pill.running .dot  { background: var(--success); }
.feed-pill.disabled .dot { background: var(--border); }
.feed-pill.stopped .dot  { background: var(--danger); }
.header-actions { display: flex; gap: 8px; }

/* ── Buttons ── */
.btn {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn:active { opacity: 0.7; }
.btn-primary  { background: var(--primary); color: #fff; }
.btn-success  { background: var(--success); color: #fff; }
.btn-danger   { background: var(--danger);  color: #fff; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-warning  { background: var(--warning);  color: #000; }
.btn-xs { padding: 3px 8px; font-size: 12px; }
.btn-full { width: 100%; margin-top: 12px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Main layout ── */
.main-layout {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── Resize handle ── */
.resize-handle {
  width: 5px;
  flex-shrink: 0;
  background: var(--border);
  cursor: col-resize;
  transition: background 0.15s;
  position: relative;
  z-index: 10;
}
.resize-handle:hover,
.resize-handle.dragging { background: var(--primary); }

/* ── Log panel ── */
.log-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 120px;
  overflow: hidden;
}
.log-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.log-toolbar-left { display: flex; align-items: center; gap: 8px; }
.log-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
#log-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  line-height: 1.6;
  background: #0a0f1e;
}
.log-line {
  padding: 1px 12px;
  white-space: pre-wrap;
  word-break: break-all;
}
.log-line:hover { background: rgba(255,255,255,0.03); }
.log-motion  { color: var(--orange); }
.log-ha      { color: var(--success); }
.log-error   { color: var(--danger); }
.log-warn    { color: var(--warning); }
.log-muted   { color: #6b7a99; }
.log-start   { color: var(--primary); }
.log-default { color: #c8d4e8; }

/* ── Config panel ── */
.config-panel {
  width: 360px;
  flex-shrink: 0;
  min-width: 200px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  flex-shrink: 0;
  padding: 10px 10px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: color 0.15s;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: none;
}
.tab-content.active { display: block; }

/* ── Form elements ── */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
input[type=text], input[type=number], input[type=url] {
  width: 100%;
  padding: 7px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
input:focus { border-color: var(--primary); }
input[type=number] { width: 80px; }

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}
.toggle-label { font-weight: 500; }

.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: var(--border);
  border-radius: 99px;
  transition: background 0.2s;
}
.slider::before {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  left: 3px; top: 3px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.2s;
}
input:checked + .slider { background: var(--primary); }
input:checked + .slider::before { transform: translateX(18px); }

/* ── Lists (cities / symbols) ── */
.list-section { margin-bottom: 14px; }
.list-section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 4px;
  font-size: 13px;
}
.list-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty-msg { color: var(--muted); font-size: 12px; font-style: italic; padding: 4px 0; }

/* ── Add row ── */
.add-row { display: flex; gap: 6px; margin-bottom: 8px; }
.add-row input { flex: 1; }

/* ── City search results ── */
#city-results {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
  overflow: hidden;
}
.city-result {
  padding: 8px 10px;
  cursor: pointer;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.city-result:last-child { border-bottom: none; }
.city-result:hover { background: var(--surface); }

/* ── Checkboxes (animation types) ── */
.checkbox-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 14px;
}
.check-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.check-item input[type=checkbox] { accent-color: var(--primary); width: 14px; height: 14px; }

/* ── Interval row ── */
.interval-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.interval-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.interval-row span  { font-size: 12px; color: var(--muted); }

/* ── Crash banner ── */
#crash-banner {
  display: none;
  background: #7f1d1d;
  border-bottom: 2px solid #ef4444;
  padding: 10px 16px;
  flex-shrink: 0;
  gap: 12px;
  align-items: flex-start;
}
#crash-banner.visible { display: flex; }
.crash-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.crash-body { flex: 1; min-width: 0; }
.crash-title { font-weight: 700; color: #fca5a5; font-size: 13px; margin-bottom: 4px; }
.crash-time  { font-size: 11px; color: #f87171; margin-bottom: 6px; }
.crash-text  {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 11px;
  color: #fecaca;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 80px;
  overflow-y: auto;
  background: rgba(0,0,0,0.3);
  padding: 6px 8px;
  border-radius: 4px;
}

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 100;
}
#toast.show { opacity: 1; }
#toast.ok  { background: var(--success); color: #fff; }
#toast.err { background: var(--danger);  color: #fff; }

/* ── Divider ── */
.divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

/* ── Queue items ── */
.queue-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 5px;
  cursor: grab;
  transition: opacity 0.15s, background 0.15s;
  user-select: none;
}
.queue-item.playing {
  border-color: var(--primary);
  background: rgba(59,130,246,0.1);
}
.queue-item.drag-over { border-color: var(--warning); background: rgba(245,158,11,0.1); }
.queue-item.dragging  { opacity: 0.4; }
.drag-handle { color: var(--muted); font-size: 14px; cursor: grab; flex-shrink: 0; }
.queue-item-body { flex: 1; min-width: 0; }
.queue-cat {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.queue-cat.cat-weather    { color: #60a5fa; }
.queue-cat.cat-stock      { color: #34d399; }
.queue-cat.cat-joke, .queue-cat.cat-jokes { color: #f472b6; }
.queue-cat.cat-animation, .queue-cat.cat-animations { color: #a78bfa; }
.queue-summary { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue-ttl { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.playing-badge {
  font-size: 10px;
  background: var(--primary);
  color: #fff;
  padding: 1px 6px;
  border-radius: 99px;
  flex-shrink: 0;
}
</style>
</head>
<body>

<header>
  <div class="header-title">&#11042; LED Display Manager</div>
  <div id="feed-status"></div>
  <div class="header-actions">
    <button id="pause-btn" class="btn btn-warning" onclick="togglePause()">&#9646;&#9646; Pause Feeds</button>
    <button class="btn btn-secondary" onclick="apiAction('restart_all')">&#8635; Restart All</button>
    <button class="btn btn-danger"    onclick="apiAction('clear_queue')">&#10005; Clear Queue</button>
  </div>
</header>

<!-- Crash banner -->
<div id="crash-banner">
  <span class="crash-icon">⚠️</span>
  <div class="crash-body">
    <div class="crash-title">PANEL CRASH — the board recovered but this needs attention</div>
    <div class="crash-time" id="crash-time"></div>
    <div class="crash-text" id="crash-text"></div>
  </div>
  <button class="btn btn-danger" style="flex-shrink:0" onclick="clearCrash()">Mark Fixed</button>
</div>

<div class="main-layout">

  <!-- Log panel -->
  <div class="log-panel">
    <div class="log-toolbar">
      <div class="log-toolbar-left">
        <span class="log-title">Live Log</span>
        <span id="log-status" style="font-size:11px;color:var(--muted)">connecting...</span>
      </div>
      <button id="scroll-resume" class="btn btn-xs btn-secondary" onclick="resumeScroll()" style="display:none">&#8595; Resume</button>
    </div>
    <div id="log-container">
      <div id="log-lines"></div>
    </div>
  </div>

  <!-- Resize handle -->
  <div class="resize-handle" id="resize-handle"></div>

  <!-- Config panel -->
  <div class="config-panel" id="config-panel">
    <div class="tabs">
      <button class="tab"        onclick="showTab('queue')">Queue</button>
      <button class="tab active" onclick="showTab('weather')">Weather</button>
      <button class="tab"        onclick="showTab('stock')">Stock</button>
      <button class="tab"        onclick="showTab('jokes')">Jokes</button>
      <button class="tab"        onclick="showTab('animations')">Anims</button>
      <button class="tab"        onclick="showTab('nasa')">NASA</button>
      <button class="tab"        onclick="showTab('wordofday')">Word</button>
      <button class="tab"        onclick="showTab('history')">History</button>
      <button class="tab"        onclick="showTab('countdown')">Countdown</button>
      <button class="tab"        onclick="showTab('quotes')">Quotes</button>
      <button class="tab"        onclick="showTab('hermes')">Hermes</button>
      <button class="tab"        onclick="showTab('jeopardy')">Jeopardy</button>
      <button class="tab"        onclick="showTab('board')">Board</button>
    </div>
    <div class="tab-content"        id="tab-queue"></div>
    <div class="tab-content active" id="tab-weather"><p style="color:var(--muted)">Loading...</p></div>
    <div class="tab-content"        id="tab-stock"></div>
    <div class="tab-content"        id="tab-jokes"></div>
    <div class="tab-content"        id="tab-animations"></div>
    <div class="tab-content"        id="tab-nasa"></div>
    <div class="tab-content"        id="tab-wordofday"></div>
    <div class="tab-content"        id="tab-history"></div>
    <div class="tab-content"        id="tab-countdown"></div>
    <div class="tab-content"        id="tab-quotes"></div>
    <div class="tab-content"        id="tab-hermes"></div>
    <div class="tab-content"        id="tab-jeopardy"></div>
    <div class="tab-content"        id="tab-board"></div>
  </div>

</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let cfg = null;
let currentTab = 'weather';
let autoScroll = true;

const ALL_ANIM_TYPES = ['fireworks','rainbow','plasma','fire','life','cube','dvd','dvd_text','matrix'];

// ── Log streaming ──────────────────────────────────────────────────────────
function connectLogs() {
  const es = new EventSource('/api/logs');
  const statusEl = document.getElementById('log-status');
  statusEl.textContent = 'connected';
  statusEl.style.color = 'var(--success)';

  es.onmessage = e => appendLog(JSON.parse(e.data));
  es.onerror = () => {
    statusEl.textContent = 'reconnecting...';
    statusEl.style.color = 'var(--warning)';
    es.close();
    setTimeout(connectLogs, 3000);
  };
}

function logClass(line) {
  const l = line.toLowerCase();
  if (l.includes('motion:'))                                                   return 'log-motion';
  if (l.includes('ha notified') || l.includes('ha notify'))                   return 'log-ha';
  if (l.includes('error') || l.includes('failed') || l.includes('econnaborted')) return 'log-error';
  if (l.includes('unreachable') || l.includes('wrong network') || l.includes('connection refused') || l.includes('timed out')) return 'log-warn';
  if (l.includes('skipping') || l.includes('disabled'))                       return 'log-muted';
  if (l.includes('started ') || l.includes('registered'))                     return 'log-start';
  return 'log-default';
}

function appendLog(line) {
  const container = document.getElementById('log-container');
  const lines     = document.getElementById('log-lines');
  const div = document.createElement('div');
  div.className = 'log-line ' + logClass(line);
  div.textContent = line;
  lines.appendChild(div);

  // cap at 1000 lines
  while (lines.children.length > 1000) lines.removeChild(lines.firstChild);

  if (autoScroll) container.scrollTop = container.scrollHeight;
}

function resumeScroll() {
  autoScroll = true;
  document.getElementById('scroll-resume').style.display = 'none';
  const container = document.getElementById('log-container');
  container.scrollTop = container.scrollHeight;
}

document.getElementById('log-container').addEventListener('scroll', function() {
  const atBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 40;
  autoScroll = atBottom;
  document.getElementById('scroll-resume').style.display = atBottom ? 'none' : '';
});

// ── Status polling ─────────────────────────────────────────────────────────
async function pollStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    renderStatus(d.feeds, d.paused);
  } catch (_) {}
}

function renderStatus(feeds, paused) {
  const el  = document.getElementById('feed-status');
  const btn = document.getElementById('pause-btn');
  el.innerHTML = feeds.map(f => {
    const cls     = paused ? 'disabled' : !f.enabled ? 'disabled' : f.running ? 'running' : 'stopped';
    const title   = f.enabled ? 'Click to disable' : 'Click to enable';
    return `<div class="feed-pill ${cls}" onclick="toggleFeed('${f.name}',${f.enabled})" title="${title}">
      <span class="dot"></span>${f.display_name || f.name}
    </div>`;
  }).join('');
  if (btn) {
    btn.textContent = paused ? '▶ Resume Feeds' : '⏸ Pause Feeds';
    btn.className   = paused ? 'btn btn-success' : 'btn btn-warning';
  }
}

async function toggleFeed(name, currentlyEnabled) {
  try {
    const r = await fetch(`/api/config/${name}`, {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body:    JSON.stringify({...(cfg[name] || {}), enabled: !currentlyEnabled}),
    });
    const d = await r.json();
    if (d.ok) {
      cfg = await (await fetch('/api/config')).json();
      toast(`${name} ${!currentlyEnabled ? 'enabled' : 'disabled'}`, 'ok');
      pollStatus();
    } else {
      toast('Failed: ' + (d.reason || '?'), 'err');
    }
  } catch (e) {
    toast('Error: ' + e.message, 'err');
  }
}

async function togglePause() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const action = d.paused ? 'resume' : 'pause';
    await fetch(`/api/actions/${action}`, {method: 'POST'});
    pollStatus();
  } catch (e) {
    toast('Error: ' + e.message, 'err');
  }
}

// ── Tab switching ──────────────────────────────────────────────────────────
function showTab(name) {
  currentTab = name;
  const tabs = ['queue','weather','stock','jokes','animations','nasa','wordofday','history','countdown','quotes','hermes','jeopardy','board'];
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', tabs[i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'queue') {
    pollQueue();
    clearInterval(queuePollTimer);
    queuePollTimer = setInterval(pollQueue, 3000);
  } else {
    clearInterval(queuePollTimer);
    renderTab(name);
  }
}

async function loadConfig() {
  const r = await fetch('/api/config');
  cfg = await r.json();
  renderTab(currentTab);
}

function renderTab(name) {
  if (!cfg) return;
  const fns = {
    weather: renderWeather, stock: renderStock, jokes: renderJokes,
    animations: renderAnimations, board: renderBoard,
    nasa: renderNasa, wordofday: renderWordOfDay,
    history: renderHistory, countdown: renderCountdown,
    quotes: renderQuotes, hermes: renderHermes, jeopardy: renderJeopardy,
  };
  if (fns[name]) fns[name]();
}

// ── Weather tab ────────────────────────────────────────────────────────────
function renderWeather() {
  const w = cfg.weather || {};
  const cities = w.cities || [];
  const el = document.getElementById('tab-weather');
  el.innerHTML = `
    <div class="toggle-row">
      <span class="toggle-label">Enabled</span>
      <label class="switch"><input type="checkbox" id="w-enabled" ${w.enabled !== false ? 'checked' : ''}><span class="slider"></span></label>
    </div>
    <div class="interval-row">
      <label>Update every</label>
      <input type="number" id="w-interval" value="${w.interval_minutes || 30}" min="1" max="360">
      <span>minutes</span>
    </div>
    <div class="list-section">
      <div class="list-section-title">Cities</div>
      <div id="w-city-list">
        ${cities.length ? cities.map((c,i) => `
          <div class="list-item">
            <span title="${c.lat}, ${c.lon}">${c.name}</span>
            <button class="btn btn-xs btn-danger" onclick="removeCity(${i})">&#10005;</button>
          </div>`).join('') : '<p class="empty-msg">No cities added</p>'}
      </div>
    </div>
    <div class="list-section">
      <div class="list-section-title">Add City</div>
      <div class="add-row">
        <input type="text" id="w-city-search" placeholder="e.g. Seattle or Tokyo" onkeydown="if(event.key==='Enter')searchCity()">

// Local-only redraw: uses current _countdownEvents without hitting the server
function _renderCountdownUI(c) {
  c = c || cfg.countdown || {};
  const enabledAttr  = c.enabled !== false ? 'checked' : '';
  const intervalVal  = c.interval_minutes || 60;
  const maxDaysVal   = c.max_days_ahead ?? 100;
  document.getElementById('tab-countdown').innerHTML = `
    <div class="toggle-row">
      <span class="toggle-label">Enabled</span>
      <label class="switch"><input type="checkbox" id="cd-enabled" ${enabledAttr}><span class="slider"></span></label>
    </div>
    <div class="interval-row">
      <label>Update every</label>
      <input type="number" id="cd-interval" value="${intervalVal}" min="10" max="1440">
      <span>minutes</span>
    </div>
    <div class="interval-row">
      <label>Start showing</label>
      <input type="number" id="cd-maxdays" value="${maxDaysVal}" min="0" max="3650">
      <span>days before (0 = always)</span>
    </div>
    <div class="list-section">
      <div class="list-section-title">Events</div>
      <div id="cd-event-list">
        ${_countdownEvents.length ? _countdownEvents.map((e,i) => `
          <div class="list-item">
            <span>${e.name} — ${e.date}${e.yearly ? ' <span title="Repeats every year">&#8635; yearly</span>' : ''}</span>
            <span>
              <button class="btn btn-xs" title="Toggle repeat every year" onclick="toggleCountdownYearly(${i})">&#8635;</button>
              <button class="btn btn-xs btn-danger" onclick="removeCountdownEvent(${i})">&#10005;</button>
            </span>
          </div>`).join('') : '<p class="empty-msg">No events added</p>'}
      </div>
    </div>
    <div class="list-section">
      <div class="list-section-title">Add Event</div>
      <div class="add-row">
        <input type="text"  id="cd-name" placeholder="Event name" style="flex:2">
        <input type="date"  id="cd-date" style="flex:1">
        <label title="Repeats every year (birthdays, holidays)" style="white-space:nowrap"><input type="checkbox" id="cd-yearly"> Yearly</label>
        <button class="btn btn-primary" onclick="addCountdownEvent()">Add</button>
      </div>
    </div>
    <button class="btn btn-success btn-full" onclick="saveCountdown()">Save Countdown Settings</button>
  `;
}

function addCountdownEvent() {
  const name = document.getElementById('cd-name').value.trim();
  const date = document.getElementById('cd-date').value;
  if (!name || !date) { toast('Name and date required', 'err'); return; }
  const yearly = document.getElementById('cd-yearly').checked;
  _countdownEvents.push(yearly ? {name, date, yearly} : {name, date});
  _renderCountdownUI();  // local redraw — no server fetch, keeps the new event
}

function toggleCountdownYearly(i) {
  const e = _countdownEvents[i];
  if (e.yearly) delete e.yearly; else e.yearly = true;
  _renderCountdownUI();  // local redraw — saved with "Save Countdown Settings"
}

function removeCountdownEvent(i) {
  _countdownEvents.splice(i, 1);
  _renderCountdownUI();  // local redraw
}

  // Save enable/interval via saveSection
  await saveSection('countdown', {
    enabled:          document.getElementById('cd-enabled').checked,
    interval_minutes: +document.getElementById('cd-interval').value,
    max_days_ahead:   +document.getElementById('cd-maxdays').value,
    events:           _countdownEvents,
  });
}

// ── Toast ──────────────────────────────────────────────────────────────────
let _toastTimer = null;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type || 'ok');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.className = '', 2500);
}

// ── Queue tab ──────────────────────────────────────────────────────────────
let queueData = [];
let queuePollTimer = null;

function queueSummary(m) {
  const cat = (m.category || '').toLowerCase();
  if (cat === 'weather') {
    const parts = [];
    if (m.city)      parts.push(m.city);
    if (m.condition) parts.push(m.condition);
    if (m.high != null) parts.push(`H:${Math.round(m.high)}`);
    if (m.low  != null) parts.push(`L:${Math.round(m.low)}`);
    return parts.join(' ') || 'Weather';
  }
  if (cat === 'stock')     return `${m.symbol || ''} $${(m.price||0).toFixed(2)} ${m.change>=0?'+':''}${(m.change||0).toFixed(2)}%`;
  if (cat === 'joke')      return (m.text || '').split('/')[0].trim().substring(0, 60);
  if (cat === 'animation') return m.type || 'animation';
  return (m.text || m.category || '').substring(0, 60);
}

async function pollQueue() {
  if (currentTab !== 'queue') return;
  try {
    const r = await fetch('/api/board/queue');
    const d = await r.json();
    queueData = d.queue || [];
    renderQueue();
  } catch (_) {}
}

function renderQueue() {
  const el = document.getElementById('tab-queue');
  if (!el.classList.contains('active')) return;
  if (!queueData.length) {
    el.innerHTML = '<p class="empty-msg" style="padding:12px">Queue is empty</p>';
    return;
  }
  el.innerHTML = queueData.map(m => `
    <div class="queue-item${m.playing ? ' playing' : ''}" draggable="true"
         data-id="${m.id}"
         ondragstart="qDragStart(event)"
         ondragover="qDragOver(event)"
         ondragleave="qDragLeave(event)"
         ondrop="qDrop(event)">
      <span class="drag-handle">&#8942;&#8942;</span>
      <div class="queue-item-body">
        <div class="queue-cat cat-${(m.category||'').toLowerCase()}">${m.category || ''}</div>
        <div class="queue-summary">${queueSummary(m)}</div>
      </div>
      ${m.playing ? '<span class="playing-badge">playing</span>' : ''}
      <span class="queue-ttl">${m.expires_in_minutes != null ? m.expires_in_minutes + 'm' : ''}</span>
      <button class="btn btn-xs btn-danger" onclick="deleteQueueItem(${m.id})">&#10005;</button>
    </div>
  `).join('');
}

async function deleteQueueItem(id) {
  await fetch('/api/board/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id}),
  });
  queueData = queueData.filter(m => m.id !== id);
  renderQueue();
}

// ── Drag and drop reorder ──────────────────────────────────────────────────
let _dragId = null;

function qDragStart(e) {
  _dragId = parseInt(e.currentTarget.dataset.id);
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function qDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function qDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

async function qDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const targetId = parseInt(e.currentTarget.dataset.id);
  if (_dragId === null || _dragId === targetId) return;

  const fromIdx = queueData.findIndex(m => m.id === _dragId);
  const toIdx   = queueData.findIndex(m => m.id === targetId);
  if (fromIdx === -1 || toIdx === -1) return;

  const item = queueData.splice(fromIdx, 1)[0];
  queueData.splice(toIdx, 0, item);
  renderQueue();

  await fetch('/api/board/reorder', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ids: queueData.map(m => m.id)}),
  });
  _dragId = null;
}

document.addEventListener('dragend', () => {
  document.querySelectorAll('.queue-item').forEach(el => el.classList.remove('dragging', 'drag-over'));
});

// ── Resizable split pane ───────────────────────────────────────────────────
(function() {
  const handle      = document.getElementById('resize-handle');
  const configPanel = document.getElementById('config-panel');
  let dragging = false;
  let startX, startW;

  handle.addEventListener('mousedown', e => {
    dragging = true;
    startX   = e.clientX;
    startW   = configPanel.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor    = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta  = startX - e.clientX;           // drag left = wider config
    const newW   = Math.min(Math.max(startW + delta, 200), window.innerWidth - 200);
    configPanel.style.width = newW + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor     = '';
    document.body.style.userSelect = '';
  });
})();

// ── Panel crash banner ─────────────────────────────────────────────────────
async function pollCrash() {
  try {
    const r = await fetch('/api/panel/crash');
    const d = await r.json();
    const banner = document.getElementById('crash-banner');
    if (d.crash) {
      document.getElementById('crash-time').textContent = 'Detected at ' + d.crash.detected_at;
      document.getElementById('crash-text').textContent = d.crash.text;
      banner.classList.add('visible');
    } else {
      banner.classList.remove('visible');
    }
  } catch (_) {}
}

async function clearCrash() {
  await fetch('/api/panel/crash/clear', {method: 'POST'});
  document.getElementById('crash-banner').classList.remove('visible');
  toast('Crash log cleared', 'ok');
}

// ── Init ───────────────────────────────────────────────────────────────────
connectLogs();
loadConfig();
pollStatus();
pollCrash();
setInterval(pollStatus, 5000);
setInterval(pollCrash, 30000);
</script>
