services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ~/homeassistant:/config
    ports:
      - "8123:8123"

  director:
    build: .
    container_name: director
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - PYTHONUTF8=1
      - FEEDME_DATA_DIR=/app/data
    volumes:
      - ./feeds/config.json:/app/feeds/config.json
      - ./data:/app/data   # caches that should survive rebuilds (Jeopardy dataset, images)
    ports:
      - "8090:8090"
      - "8099:8099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
